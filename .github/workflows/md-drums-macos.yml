name: MD Drums macOS universal build

# MD Drums (mdDrumsPlugin) for macOS, Apple Silicon and Intel in one binary, as VST3 and AU: an installer package and a
# zip, both signed ad hoc and not notarized. The runner has no Machinedrum flash image, so nothing here hears it play.
# Run it by hand; the artifact goes to a release as an untested build.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version in the file names, the package and the editor (e.g. 0.1.1)"
        required: true
        default: "0.1.1"

permissions:
  contents: read

jobs:
  build:
    name: MD Drums macOS universal VST3 and AU
    runs-on: macos-14
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          -DXCODE_VERSION=16
          -DGEARMULATOR_JUCE_PRODUCTS_ROOT="${{ github.workspace }}/build/products"
          -DMD_DRUMS_VERSION="${{ inputs.version }}"
          -DBUILD_TESTING=ON
          -Dgearmulator_BUILD_JUCEPLUGIN=ON
          -Dgearmulator_BUILD_FX_PLUGIN=OFF
          -Dgearmulator_BUILD_JUCEPLUGIN_VST2=OFF
          -Dgearmulator_BUILD_JUCEPLUGIN_VST3=ON
          -Dgearmulator_BUILD_JUCEPLUGIN_CLAP=OFF
          -Dgearmulator_BUILD_JUCEPLUGIN_LV2=OFF
          -Dgearmulator_BUILD_JUCEPLUGIN_AU=ON
          -Dgearmulator_BUILD_JUCEPLUGIN_Standalone=OFF
          -Dgearmulator_SYNTH_ELEKTRON=ON
          -Dgearmulator_SYNTH_OSIRUS=OFF
          -Dgearmulator_SYNTH_OSTIRUS=OFF
          -Dgearmulator_SYNTH_VAVRA=OFF
          -Dgearmulator_SYNTH_XENIA=OFF
          -Dgearmulator_SYNTH_NODALRED2X=OFF
          -Dgearmulator_SYNTH_JE8086=OFF

      - name: Build
        env:
          # JUCE runs the VST3 while it writes its metadata: keep it out of the runner's real folders
          GEARMULATOR_DATA_ROOT: ${{ runner.temp }}/md-drums-data
        run: cmake --build build --parallel 4 --target mdDrumsPlugin_VST3 mdDrumsPlugin_AU mdProtocolKitTest

      - name: Test what needs no flash image
        run: ctest --test-dir build -R "^mdProtocolKitTest$" --output-on-failure

      - name: Sign ad hoc and check both architectures
        run: |
          set -euo pipefail
          products="build/products/Release"
          for bundle in "${products}/VST3/MD Drums.vst3" "${products}/AU/MD Drums.component"; do
            test -d "${bundle}"
            rm -f "${bundle}/Contents/Resources/moduleinfo.json"
            codesign --force --deep --sign - "${bundle}"
            codesign --verify --deep --strict "${bundle}"
            archs="$(lipo -archs "${bundle}/Contents/MacOS/MD Drums")"
            echo "${bundle}: ${archs}"
            [[ " ${archs} " == *" arm64 "* && " ${archs} " == *" x86_64 "* ]]
          done

      - name: Package
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          products="build/products/Release"
          name="MD-Drums-${VERSION}-preview-macOS-universal"
          out="${RUNNER_TEMP}/out"
          mkdir -p "${out}"

          # The installer: both bundles into /Library/Audio/Plug-Ins, never relocated to another copy
          root="${RUNNER_TEMP}/pkgroot"
          mkdir -p "${root}/Library/Audio/Plug-Ins/VST3" "${root}/Library/Audio/Plug-Ins/Components"
          ditto "${products}/VST3/MD Drums.vst3" "${root}/Library/Audio/Plug-Ins/VST3/MD Drums.vst3"
          ditto "${products}/AU/MD Drums.component" "${root}/Library/Audio/Plug-Ins/Components/MD Drums.component"
          plist="${RUNNER_TEMP}/components.plist"
          pkgbuild --analyze --root "${root}" "${plist}"
          # plutil cannot walk a plist whose root is an array; PlistBuddy can
          i=0
          while /usr/libexec/PlistBuddy -c "Print :${i}" "${plist}" > /dev/null 2>&1; do
            /usr/libexec/PlistBuddy -c "Set :${i}:BundleIsRelocatable false" "${plist}"
            i=$((i + 1))
          done
          echo "${i} bundles, none relocatable"
          test "${i}" -ge 2
          pkgbuild --root "${root}" --component-plist "${plist}" \
            --identifier com.c0remusic.mddrums --version "${VERSION}" --install-location / \
            "${out}/${name}.pkg"

          # The zip: the bundles, the README and the licences
          stage="${RUNNER_TEMP}/${name}"
          mkdir -p "${stage}"
          ditto "${products}/VST3/MD Drums.vst3" "${stage}/MD Drums.vst3"
          ditto "${products}/AU/MD Drums.component" "${stage}/MD Drums.component"
          cp scripts/macos/md-drums-README.txt "${stage}/README.txt"
          cp NOTICE.md LICENSE.md "${stage}/"
          cp source/elektron/md/mdEngine/LICENSE "${stage}/LICENSE-AGPL.txt"
          cp source/elektron/md/mdDrumsPlugin/skins/mdDrums/Inter-OFL.txt "${stage}/"
          ditto -c -k --keepParent "${stage}" "${out}/${name}.zip"

          cd "${out}"
          shasum -a 256 *.pkg *.zip | tee SHA256.txt
          git -C "${GITHUB_WORKSPACE}" rev-parse HEAD > commit.txt

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: MD-Drums-${{ inputs.version }}-macOS-universal-${{ github.sha }}
          path: ${{ runner.temp }}/out/*
